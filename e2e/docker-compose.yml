# Local WireGuard network for end-to-end tests: two stock peers (the Docker
# VM's kernel WireGuard), an AmneziaWG peer, echo services, and the ztnx
# client built for Linux. setup.sh generates the keys and .conf files under
# state/.
name: ztnx-e2e

networks:
  ztnx:
    ipam:
      config:
        - subnet: 172.31.2.0/24

services:
  # The server most tests talk to: wg 10.7.0.1, UDP 51820, with every
  # client from state/keys.txt as a peer.
  peer:
    build: { context: ., dockerfile: Dockerfile.peer }
    image: ztnx-e2e-peer
    volumes:
      - ./state/wg0.conf:/etc/wireguard/wg0.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    networks:
      ztnx:
        ipv4_address: 172.31.2.20
        aliases: [wg-server]
    profiles: [peer]

  # A second server (wg 10.7.0.9) for the several-peers test.
  peer2:
    image: ztnx-e2e-peer
    volumes:
      - ./state/wg0-peer2.conf:/etc/wireguard/wg0.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    networks:
      ztnx:
        ipv4_address: 172.31.2.21
    depends_on: [peer]
    profiles: [peer]

  # An AmneziaWG server (awg 10.7.1.1) for the obfuscation tests. Its port
  # is also published on the host (UDP 51821) so a console on the LAN can
  # test against it with state/awg-switch.conf.
  awg-peer:
    build: { context: ., dockerfile: Dockerfile.awg-peer }
    image: ztnx-e2e-awg-peer
    volumes:
      - ./state/awg0.conf:/etc/amnezia/amneziawg/awg0.conf:ro
      - ./state/awg1.conf:/etc/amnezia/amneziawg/awg1.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    ports: ["51821:51820/udp", "51822:51821/udp"]
    networks:
      ztnx:
        ipv4_address: 172.31.2.22
    profiles: [peer]

  # HTTP (8080) and iperf3 (5201) servers inside peer's network namespace,
  # reachable on its tunnel address (and its real one, for pass-through).
  web:
    image: python:3-alpine
    network_mode: service:peer
    command: ["python3", "-m", "http.server", "8080"]
    depends_on: [peer]
    profiles: [peer]

  iperf:
    image: networkstatic/iperf3
    network_mode: service:peer
    command: ["-s"]
    depends_on: [peer]
    profiles: [peer]

  # ztnx-host built for Linux and run on the compose network.
  # Build:  docker compose run --rm ztnx-build
  # Run:    docker compose run --rm ztnx up --conf /state/client.conf ...
  ztnx-build:
    image: ztnx-e2e-client
    build: { context: ., dockerfile: Dockerfile.client }
    working_dir: /src
    volumes:
      - ..:/src
      - ztnx-cargo:/usr/local/cargo/registry
    environment:
      CARGO_TARGET_DIR: /src/target/linux
    entrypoint: ["/src/e2e/build-linux.sh"]
    profiles: [ztnx]

  ztnx:
    image: ztnx-e2e-client
    build: { context: ., dockerfile: Dockerfile.client }
    working_dir: /src
    volumes:
      - ..:/src:ro
      - ./state:/state
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/src/target/linux/bin/ztnx-host"]
    cap_add: [NET_ADMIN]
    networks:
      ztnx:
        ipv4_address: 172.31.2.30
    profiles: [ztnx]

volumes:
  ztnx-cargo:
