# The test network: a self-hosted ZeroTier controller, stock zerotier-one
# peers, and a container where our own Linux builds run. The ZeroTier nodes
# find each other through ZeroTier's public root servers, so this needs
# internet access. Run through the scripts (setup.sh, run-tests.sh), which
# set the paths below (env.sh).
name: ztnx-e2e

networks:
  zt:
    ipam:
      config:
        - subnet: 172.31.2.0/24

services:
  controller:
    image: ztnx-e2e-controller
    build:
      context: ${ZTNX_ZT_DIR}/../..
      dockerfile: docker/Dockerfile.controller
    environment:
      ZEROTIER_API_SECRET: e2e-controller-token
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ${ZTNX_STATE_DIR}/controller:/var/lib/zerotier-one
    networks:
      zt:
        ipv4_address: 172.31.2.10

  peer:
    image: ztnx-e2e-peer
    build:
      context: ../docker
      dockerfile: Dockerfile.peer
    environment:
      ZEROTIER_API_SECRET: e2e-peer-token
      ZT_RUN_SERVERS: "1"
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ${ZTNX_STATE_DIR}/peer:/var/lib/zerotier-one
    networks:
      zt:
        ipv4_address: 172.31.2.20

  peer2:
    image: ztnx-e2e-peer
    profiles: [extra]
    environment:
      ZEROTIER_API_SECRET: e2e-peer-token
      ZT_RUN_SERVERS: "1"
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ${ZTNX_STATE_DIR}/peer2:/var/lib/zerotier-one
    networks:
      zt:
        ipv4_address: 172.31.2.21

  # Our builds for Linux run here (e2e/build-linux.sh puts them in /out).
  client:
    image: ztnx-e2e-client
    build:
      context: .
      dockerfile: Dockerfile.client
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - ..:/src
      - ${ZTNX_ZT_DIR}:/src/third_party/ZeroTierOne
      - ${ZTNX_OUT_DIR}:/out
      - ${ZTNX_STATE_DIR}/client:/state
      - ztnx-e2e-cargo:/usr/local/cargo/registry
    working_dir: /src
    networks:
      zt:
        ipv4_address: 172.31.2.30

volumes:
  ztnx-e2e-cargo:
